# Bench overrides: whitelist localhost so throughput isn't capped by rate
# limits (limits.event.whitelists.ipAddresses bypasses EVENT rate limiting;
# message/connection ipWhitelist bypass the raw-message limits).
limits:
  event:
    whitelists:
      ipAddresses:
        - "::1"
        - "127.0.0.1"
        - "::ffff:127.0.0.1"
  message:
    ipWhitelist:
      - "::1"
      - "127.0.0.1"
      - "::ffff:127.0.0.1"
  connection:
    ipWhitelist:
      - "::1"
      - "127.0.0.1"
      - "::ffff:127.0.0.1"
